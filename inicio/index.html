<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.S.A.I. Manutenções - Acompanhamento</title>
  
  <!-- Ligação para o teu ficheiro CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Cabeçalho / Navbar -->
  <header class="navbar">
    <div class="logo">
      <img src="pecas.png" alt="A.S.A.I. Manutenções" class="logo-img">
      <span>A.S.A.I.<br>MANUTENÇÕES</span>
    </div>
    <nav class="nav-links">
      <a href="#">Início</a>
      <a href="#">Login</a>
      <a href="#">Artigos</a>
      <a href="#">Suporte</a>
      <span class="menu-icon">&#9776;</span>
    </nav>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">
    
    <!-- Linha do Tempo / Stepper -->
    <div class="stepper">
      <div class="stepper-line"></div>

      <div class="step">
        <div class="step-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <path d="m9 15 2 2 4-4"></path>
          </svg>
        </div>
        <span class="step-label">Pedido feito</span>
      </div>

      <div class="step">
        <div class="step-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </div>
        <span class="step-label">Em execução</span>
      </div>

      <div class="step">
        <div class="step-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </div>
        <span class="step-label">Em revisão</span>
      </div>

      <div class="step">
        <div class="step-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="step-label">Finalizado</span>
      </div>
    </div>

    <!-- Tabela / Cartão de Datas -->
    <div class="dates-card">
      <div class="date-item">
        <h3>Pedido feito em:</h3>
        <p>07/10/2026</p>
      </div>
      <div class="date-item">
        <h3>Data de início:</h3>
        <p>10/10/2026</p>
      </div>
      <div class="date-item">
        <h3>Revisão iniciada em:</h3>
        <p>15/10/2026</p>
      </div>
      <div class="date-item">
        <h3>Finalizado em:</h3>
        <p>18/10/2026</p>
      </div>
    </div>

  </main>

</body>
</html>
